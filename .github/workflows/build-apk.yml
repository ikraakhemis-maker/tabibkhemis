name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Locate Android project
      id: loc
      run: |
        FILE=$(find . -name settings.gradle -not -path "*/node_modules/*" | head -1)
        if [ -z "$FILE" ]; then
          echo "::error::settings.gradle not found. Upload the Android project files (app/, build.gradle, settings.gradle ...) to the repository."
          ls -R | head -50
          exit 1
        fi
        DIR=$(dirname "$FILE")
        echo "Project dir: $DIR"
        echo "dir=$DIR" >> "$GITHUB_OUTPUT"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build debug APK
      working-directory: ${{ steps.loc.outputs.dir }}
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Tabib-Khemis-APK
        path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
